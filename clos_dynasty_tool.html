<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLOS // Dynasty War Room</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --bg-base: #0A0A0A;
  --bg-navy: #0D1B2A;
  --bg-surface: #11202F;
  --bg-elevated: #16273A;
  --bg-charcoal: #1C1C1E;
  --border-subtle: #243447;
  --border-strong: #38536F;
  --text-primary: #F5F5F7;
  --text-secondary: #A8B2BB;
  --text-tertiary: #6B7480;
  --accent-silver: #A8B2BB;
  --accent-gold: #D4AF37;
  --grade-elite: #8BC97D;
  --grade-good: #B4D88C;
  --grade-ok: #E8C547;
  --grade-warn: #E8A33D;
  --grade-bad: #C24545;
  --font-display: 'Bebas Neue', sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

button {
  font-family: var(--font-body);
  cursor: pointer;
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--text-primary);
  padding: 8px 14px;
  font-size: 13px;
  letter-spacing: 0.02em;
  transition: background 0.15s, border-color 0.15s;
}
button:hover { background: var(--bg-elevated); border-color: var(--accent-silver); }
button.primary { background: var(--text-primary); color: var(--bg-base); border-color: var(--text-primary); font-weight: 500; }
button.primary:hover { background: var(--accent-silver); border-color: var(--accent-silver); }
button.ghost { border-color: transparent; padding: 6px 10px; }
button.ghost:hover { background: var(--bg-elevated); }
button.danger:hover { border-color: var(--grade-bad); color: var(--grade-bad); background: transparent; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

input[type="text"], input[type="number"], select {
  font-family: var(--font-body);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  padding: 8px 12px;
  font-size: 13px;
  width: 100%;
}
input:focus, select:focus { outline: none; border-color: var(--accent-silver); }

.app-shell {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 32px 80px;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 20px;
  margin-bottom: 28px;
  border-bottom: 1px solid var(--border-subtle);
}
.brand {
  display: flex;
  align-items: center;
  gap: 16px;
}
.brand-mark {
  width: 40px;
  height: 40px;
  background: var(--text-primary);
  color: var(--bg-base);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 24px;
  letter-spacing: 0.05em;
}
.brand-title { font-family: var(--font-display); font-size: 22px; letter-spacing: 0.08em; margin: 0; line-height: 1; }
.brand-sub { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.15em; margin-top: 4px; }

.team-meta { display: flex; gap: 16px; align-items: center; }
.team-pill {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  padding: 8px 14px;
  font-size: 12px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-secondary);
}
.team-pill strong { color: var(--text-primary); font-weight: 500; letter-spacing: 0.05em; }

/* Section eyebrow */
.eyebrow {
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  margin: 0 0 12px;
  font-weight: 500;
}

/* Overview grid */
.group-section { margin-bottom: 36px; }
.group-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}
.pos-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  padding: 16px 14px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color 0.15s, background 0.15s;
  position: relative;
}
.pos-card:hover { border-color: var(--accent-silver); background: var(--bg-elevated); }
.pos-card.empty { opacity: 0.55; }
.pos-card.empty:hover { opacity: 1; }
.pos-abbr { font-family: var(--font-display); font-size: 28px; letter-spacing: 0.05em; line-height: 1; }
.pos-line { display: flex; justify-content: space-between; align-items: baseline; }
.pos-count { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.1em; }
.pos-ovr { font-size: 18px; font-weight: 500; color: var(--text-primary); }
.pos-grade {
  position: absolute;
  top: 12px;
  right: 12px;
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: 0.05em;
  padding: 2px 8px;
  border: 1px solid currentColor;
}
.pos-empty-tag {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--text-tertiary);
  margin-top: 4px;
}

/* Detail view */
.detail-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 16px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border-subtle);
  gap: 16px;
}
.detail-title { font-family: var(--font-display); font-size: 42px; letter-spacing: 0.08em; line-height: 1; margin: 8px 0 0; }
.detail-sub { font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.15em; margin-top: 8px; }

.player-table {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 24px;
}
.player-table th {
  text-align: left;
  padding: 12px 14px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--text-tertiary);
  font-weight: 500;
  background: var(--bg-base);
  border-bottom: 1px solid var(--border-subtle);
}
.player-table td {
  padding: 14px;
  border-top: 1px solid var(--border-subtle);
  font-size: 13px;
  vertical-align: top;
}
.player-table tbody tr:first-child td { border-top: none; }
.player-table tbody tr.starter { background: rgba(212, 175, 55, 0.04); }
.player-name { font-weight: 500; }
.player-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; }
.player-ovr { font-family: var(--font-display); font-size: 22px; letter-spacing: 0.05em; text-align: center; }
.attr-list { font-size: 12px; color: var(--text-secondary); font-family: var(--font-body); }
.dev-trait { font-size: 12px; }
.dev-normal { color: var(--text-secondary); }
.dev-impact { color: var(--grade-good); }
.dev-star { color: var(--accent-gold); }
.dev-elite { color: var(--accent-gold); font-weight: 500; }

/* Analysis */
.analysis-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.metric-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  padding: 16px 18px;
}
.metric-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-tertiary); margin: 0 0 8px; }
.metric-value { font-family: var(--font-display); font-size: 32px; letter-spacing: 0.05em; line-height: 1; margin: 0; }
.metric-value.small { font-size: 18px; font-family: var(--font-body); font-weight: 500; }
.metric-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.1em; }

.insight-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.insight-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  padding: 16px 18px;
}
.insight-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-tertiary); margin: 0 0 10px; }
.insight-card ul { margin: 0; padding-left: 16px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
.insight-card li { margin-bottom: 4px; }
.insight-card.pos { border-left: 2px solid var(--grade-good); }
.insight-card.neg { border-left: 2px solid var(--grade-warn); }

/* Empty state */
.empty-state {
  background: var(--bg-surface);
  border: 1px dashed var(--border-strong);
  padding: 48px 24px;
  text-align: center;
  margin-bottom: 24px;
}
.empty-state-title { font-family: var(--font-display); font-size: 28px; letter-spacing: 0.08em; margin: 0 0 8px; }
.empty-state-text { color: var(--text-secondary); margin: 0 0 20px; font-size: 13px; }

/* Modal */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.78);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 24px;
}
.modal {
  background: var(--bg-navy);
  border: 1px solid var(--border-strong);
  max-width: 720px;
  width: 100%;
  max-height: calc(100vh - 48px);
  overflow-y: auto;
  padding: 28px 32px;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border-subtle); }
.modal-title { font-family: var(--font-display); font-size: 26px; letter-spacing: 0.08em; margin: 0; }
.modal-close { background: transparent; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; padding: 4px 10px; }
.modal-close:hover { color: var(--text-primary); background: var(--bg-elevated); }

/* Form */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-tertiary); margin-bottom: 6px; font-weight: 500; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-subtle); }

/* Ingest */
.drop-zone {
  border: 1px dashed var(--border-strong);
  padding: 32px 16px;
  text-align: center;
  background: var(--bg-surface);
  transition: border-color 0.15s, background 0.15s;
}
.drop-zone.hover { border-color: var(--accent-silver); background: var(--bg-elevated); }
.drop-zone-title { font-family: var(--font-display); font-size: 22px; letter-spacing: 0.08em; margin: 0 0 6px; }
.drop-zone-text { font-size: 12px; color: var(--text-secondary); margin: 0 0 16px; }
.file-input { display: none; }

.thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 16px; }
.thumb { position: relative; aspect-ratio: 16/9; background: var(--bg-base); border: 1px solid var(--border-subtle); overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb-remove { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.75); border: none; color: white; width: 22px; height: 22px; cursor: pointer; font-size: 12px; padding: 0; display: flex; align-items: center; justify-content: center; }
.thumb-remove:hover { background: var(--grade-bad); }

.status-bar { background: var(--bg-surface); border: 1px solid var(--border-subtle); padding: 12px 16px; margin: 16px 0; font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 10px; }
.status-bar.error { border-color: var(--grade-bad); color: var(--grade-bad); }
.spinner { width: 12px; height: 12px; border: 2px solid var(--border-subtle); border-top-color: var(--accent-silver); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.preview-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; background: var(--bg-surface); border: 1px solid var(--border-subtle); }
.preview-table th { background: var(--bg-base); padding: 8px 10px; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-tertiary); font-weight: 500; border-bottom: 1px solid var(--border-subtle); }
.preview-table td { padding: 8px 10px; border-top: 1px solid var(--border-subtle); }
.preview-table input { padding: 4px 6px; font-size: 12px; min-width: 0; }
.preview-table input.compact { width: 50px; }
.preview-table input.name { width: 100%; min-width: 110px; }

/* Util */
.row-flex { display: flex; gap: 10px; align-items: center; }
.spacer { flex: 1; }
.muted { color: var(--text-tertiary); }
.center { text-align: center; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.hidden { display: none !important; }

@media (max-width: 720px) {
  .app-shell { padding: 16px; }
  .header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .analysis-grid { grid-template-columns: 1fr; }
  .insight-grid { grid-template-columns: 1fr; }
  .detail-title { font-size: 32px; }
  .field-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app-shell">
  <header class="header">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div>
        <h1 class="brand-title">Dynasty War Room</h1>
        <div class="brand-sub" id="brand-sub">Position group analyzer · v1</div>
      </div>
    </div>
    <div class="team-meta" id="team-meta"></div>
  </header>

  <main id="view-root"></main>
</div>

<div id="modal-root"></div>

<script>
const POSITION_GROUPS = [
  { label: 'Offense', positions: ['QB', 'HB', 'FB', 'WR', 'TE'] },
  { label: 'Offensive Line', positions: ['LT', 'LG', 'C', 'RG', 'RT'] },
  { label: 'Defensive Line', positions: ['LE', 'DT', 'RE'] },
  { label: 'Linebackers', positions: ['LOLB', 'MLB', 'ROLB'] },
  { label: 'Defensive Backs', positions: ['CB', 'FS', 'SS'] },
  { label: 'Specialists', positions: ['K', 'P'] }
];

const POSITION_KEY_ATTRS = {
  QB: ['THP', 'SAC', 'MAC', 'DAC', 'ACC', 'AWR'],
  HB: ['SPD', 'ACC', 'AGI', 'BTK', 'JKM', 'CAR', 'TRK'],
  FB: ['TRK', 'CAR', 'STR', 'RBK', 'IBL'],
  WR: ['SPD', 'ACC', 'AGI', 'CTH', 'RTE', 'JMP'],
  TE: ['CTH', 'RBK', 'RTE', 'SPD', 'STR'],
  LT: ['PBK', 'RBK', 'PBS', 'STR', 'AWR'],
  LG: ['RBK', 'PBK', 'RBS', 'STR', 'AWR'],
  C:  ['RBK', 'PBK', 'RBS', 'STR', 'AWR'],
  RG: ['RBK', 'PBK', 'RBS', 'STR', 'AWR'],
  RT: ['PBK', 'RBK', 'PBS', 'STR', 'AWR'],
  LE: ['PMV', 'FMV', 'BSH', 'STR', 'TAK'],
  RE: ['PMV', 'FMV', 'BSH', 'STR', 'TAK'],
  DT: ['BSH', 'PMV', 'STR', 'TAK', 'PRC'],
  LOLB: ['TAK', 'STR', 'PMV', 'PRC', 'ACC'],
  MLB: ['TAK', 'AWR', 'PRC', 'ZON', 'STR'],
  ROLB: ['TAK', 'STR', 'PMV', 'PRC', 'ACC'],
  CB: ['MCV', 'ZCV', 'ACC', 'SPD', 'AWR'],
  FS: ['ZCV', 'MCV', 'ACC', 'SPD', 'HPW'],
  SS: ['ZCV', 'MCV', 'ACC', 'SPD', 'TAK'],
  K:  ['KPW', 'KAC', 'AWR'],
  P:  ['KPW', 'KAC', 'AWR']
};

const STORAGE_KEY = 'clos_dynasty_v1';

let state = {
  team: null,
  players: {},
  snapshots: [],
  currentView: 'overview',
  currentPosition: null
};

async function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = { ...state, ...parsed };
    }
  } catch (e) {
    // No data yet, fine
  }
}

async function saveState() {
  const toSave = {
    team: state.team,
    players: state.players,
    snapshots: state.snapshots
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch (e) {
    console.error('Storage save failed:', e);
    alert('Could not save data. Browser storage may be full or blocked.');
  }
}

function makePlayerId(position, name) {
  const clean = (name || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  return `${(position || 'unk').toLowerCase()}_${clean}`;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function playersForPosition(pos) {
  return Object.values(state.players).filter(p => p.position === pos);
}

function devTraitClass(dev) {
  const d = (dev || '').toLowerCase();
  if (d.includes('elite')) return 'dev-elite';
  if (d.includes('star')) return 'dev-star';
  if (d.includes('impact')) return 'dev-impact';
  return 'dev-normal';
}

function computeDepthGrade(players) {
  if (players.length === 0) return { grade: '—', tone: 'empty', note: 'No players' };
  const sorted = [...players].sort((a, b) => (b.ovr || 0) - (a.ovr || 0));
  const s = sorted[0]?.ovr || 0;
  const b = sorted[1]?.ovr || 0;
  if (s >= 90 && b >= 85) return { grade: 'A+', tone: 'elite', note: 'Elite starter and elite backup' };
  if (s >= 90 && b >= 78) return { grade: 'A', tone: 'elite', note: 'Elite starter with solid depth' };
  if (s >= 90)            return { grade: 'A-', tone: 'good', note: 'Elite starter, thin behind' };
  if (s >= 85 && b >= 82) return { grade: 'A-', tone: 'good', note: 'Strong starter and capable backup' };
  if (s >= 85 && b >= 78) return { grade: 'B+', tone: 'good', note: 'Strong starter with adequate depth' };
  if (s >= 85)            return { grade: 'B',  tone: 'good', note: 'Strong starter, thin behind' };
  if (s >= 80 && b >= 75) return { grade: 'B-', tone: 'ok',   note: 'Solid starter with usable depth' };
  if (s >= 80)            return { grade: 'C+', tone: 'ok',   note: 'Solid starter, weak depth' };
  if (s >= 75)            return { grade: 'C',  tone: 'warn', note: 'Average starter — upgrade window open' };
  return { grade: 'D', tone: 'bad', note: 'Position group needs help' };
}

function gradeColor(tone) {
  if (tone === 'elite') return 'var(--grade-elite)';
  if (tone === 'good')  return 'var(--grade-good)';
  if (tone === 'ok')    return 'var(--grade-ok)';
  if (tone === 'warn')  return 'var(--grade-warn)';
  if (tone === 'bad')   return 'var(--grade-bad)';
  return 'var(--text-tertiary)';
}

function computeInsights(players, position) {
  const keyAttrs = POSITION_KEY_ATTRS[position] || [];
  const strengths = [];
  const watchouts = [];
  if (players.length === 0) return { strengths, watchouts };
  const starter = [...players].sort((a, b) => (b.ovr || 0) - (a.ovr || 0))[0];

  for (const a of keyAttrs) {
    const vals = players.map(p => p.attributes?.[a]).filter(v => typeof v === 'number');
    if (vals.length === 0) continue;
    const max = Math.max(...vals);
    const starterVal = starter.attributes?.[a];
    if (max >= 88) {
      const owner = players.find(p => p.attributes?.[a] === max);
      strengths.push(`${a} ${max} — ${owner?.name || 'top player'}${vals.filter(v => v >= 85).length > 1 ? ' (room-wide strength)' : ''}`);
    }
    if (typeof starterVal === 'number' && starterVal < 70) {
      watchouts.push(`Starter ${a} only ${starterVal} — exposure risk`);
    }
  }

  const noDev = players.filter(p => !p.devTrait || p.devTrait === '—').length;
  if (noDev > 0) {
    watchouts.push(`Dev trait unknown for ${noDev} player${noDev > 1 ? 's' : ''} — highlight in-game and re-ingest`);
  }
  const elites = players.filter(p => (p.devTrait || '').toLowerCase().includes('elite') || (p.devTrait || '').toLowerCase().includes('star'));
  if (elites.length > 0) {
    strengths.push(`Dev pipeline: ${elites.map(p => `${p.name} (${p.devTrait})`).join(', ')}`);
  }

  if (strengths.length === 0 && players.length > 0) strengths.push(`Starter at ${starter.ovr || '?'} OVR sets the floor`);
  if (watchouts.length === 0 && players.length > 0) watchouts.push('No glaring weaknesses in key attrs');
  return { strengths: strengths.slice(0, 4), watchouts: watchouts.slice(0, 4) };
}

function findCeilingWatch(players) {
  const young = players.filter(p => /^FR|^SO/.test(p.year || ''));
  if (young.length === 0) return null;
  const keyPhysicals = ['SPD', 'ACC', 'AGI', 'STR'];
  return young.sort((a, b) => {
    const aScore = keyPhysicals.reduce((s, k) => s + (a.attributes?.[k] || 0), 0);
    const bScore = keyPhysicals.reduce((s, k) => s + (b.attributes?.[k] || 0), 0);
    return bScore - aScore;
  })[0];
}

function renderHeader() {
  const meta = document.getElementById('team-meta');
  const sub = document.getElementById('brand-sub');
  if (!state.team) {
    meta.innerHTML = `<button class="primary" onclick="openSetup()">Set Up Team</button>`;
    sub.textContent = 'Position group analyzer · v1';
    return;
  }
  sub.textContent = `${state.team.name}`;
  meta.innerHTML = `
    <div class="team-pill">SZN <strong>${escapeHtml(state.team.season)}</strong> · WK <strong>${escapeHtml(state.team.week)}</strong></div>
    <button class="ghost" onclick="openSetup()" title="Edit team settings">⚙</button>
  `;
}

function render() {
  renderHeader();
  const root = document.getElementById('view-root');
  if (!state.team) { root.innerHTML = renderEmptyApp(); return; }
  if (state.currentView === 'detail' && state.currentPosition) {
    root.innerHTML = renderDetail(state.currentPosition);
  } else {
    root.innerHTML = renderOverview();
  }
}

function renderEmptyApp() {
  return `
    <div class="empty-state">
      <h2 class="empty-state-title">Welcome, Coach.</h2>
      <p class="empty-state-text">Set up your team to get started. You can update the season & week any time.</p>

  `;
}

function renderOverview() {
  const total = Object.keys(state.players).length;
  return `
    <p class="eyebrow">Roster overview</p>
    <p class="muted" style="margin: 0 0 28px; font-size: 13px;">${total} player${total === 1 ? '' : 's'} tracked across position groups. Click a position to inspect or update.</p>
    ${POSITION_GROUPS.map(g => renderGroupSection(g)).join('')}

}

function renderGroupSection(group) {
  return `
    <section class="group-section">
      <p class="eyebrow">${escapeHtml(group.label)}</p>
      <div class="group-row">
        ${group.positions.map(pos => renderPosCard(pos)).join('')}

function renderPosCard(pos) {
  const players = playersForPosition(pos);
  const grade = computeDepthGrade(players);
  const starter = [...players].sort((a, b) => (b.ovr || 0) - (a.ovr || 0))[0];
  if (players.length === 0) {
    return `
      <div class="pos-card empty" onclick="openDetail('${pos}')">

        <div class="pos-empty-tag">No data</div>
      </div>

  }
  return `
    <div class="pos-card" onclick="openDetail('${pos}')">

      <div class="pos-abbr">${pos}</div>
      <div class="pos-line">
        <span class="pos-count">${players.length} ${players.length === 1 ? 'player' : 'players'}</span>
        <span class="pos-ovr">${starter?.ovr ?? '—'}</span>

    </div>
  `;
}

function renderDetail(pos) {
  const players = playersForPosition(pos);
  const sorted = [...players].sort((a, b) => (b.ovr || 0) - (a.ovr || 0));
  const grade = computeDepthGrade(sorted);
  const starter = sorted[0];
  const insights = computeInsights(sorted, pos);
  const ceiling = findCeilingWatch(sorted);

  return `
    <div class="detail-header">
      <div>
        <p class="eyebrow" style="margin: 0;">Position group</p>
        <h2 class="detail-title">${escapeHtml(pos)}</h2>
        <p class="detail-sub">${escapeHtml(state.team.name)} · Season ${escapeHtml(state.team.season)} · Week ${escapeHtml(state.team.week)}</p>
      </div>
      <div class="row-flex">
        <button class="ghost" onclick="backToOverview()">← Overview</button>
        <button class="primary" onclick="openIngest('${pos}')">Update group</button>
      </div>
    </div>

    ${sorted.length === 0 ? `
      <div class="empty-state">
        <h2 class="empty-state-title">No ${pos} on file</h2>
        <p class="empty-state-text">Upload roster screenshots for this position and the tool will extract player data automatically.</p>
        <button class="primary" onclick="openIngest('${pos}')">Ingest screenshots</button>
      </div>
    ` : `
      <table class="player-table">
        <thead>
          <tr>
            <th style="width: 32%;">Player</th>
            <th style="width: 10%;">Year</th>
            <th style="width: 10%;">OVR</th>
            <th style="width: 34%;">Key attrs</th>
            <th style="width: 14%;">Dev</th>
          </tr>
        </thead>
        <tbody>
          ${sorted.map((p, i) => renderPlayerRow(p, i === 0, pos)).join('')}
        </tbody>
      </table>

      <div class="analysis-grid">
        <div class="metric-card">
          <p class="metric-label">Depth grade</p>
          <p class="metric-value" style="color: ${gradeColor(grade.tone)};">${escapeHtml(grade.grade)}</p>
          <p class="metric-sub">${escapeHtml(grade.note)}</p>
        </div>
        <div class="metric-card">
          <p class="metric-label">Starter</p>
          <p class="metric-value small">${escapeHtml(starter?.name || '—')}</p>
          <p class="metric-sub">${starter?.ovr ?? '—'} OVR · ${escapeHtml(starter?.archetype || '—')}</p>
        </div>
        <div class="metric-card">
          <p class="metric-label">Ceiling watch</p>
          <p class="metric-value small">${escapeHtml(ceiling?.name || '—')}</p>
          <p class="metric-sub">${ceiling ? `${escapeHtml(ceiling.year || '')} · ${ceiling.ovr || '?'} OVR` : 'No young prospects'}</p>
        </div>
      </div>

      <div class="insight-grid">
        <div class="insight-card pos">
          <p class="insight-title">Strengths</p>
          <ul>${insights.strengths.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>
        </div>
        <div class="insight-card neg">
          <p class="insight-title">Watch-outs</p>
          <ul>${insights.watchouts.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>
        </div>
      </div>

      <div class="row-flex mt-16">
        <span class="muted" style="font-size: 12px;">${sorted.length} player${sorted.length === 1 ? '' : 's'} tracked</span>
        <div class="spacer"></div>
        <button class="ghost danger" onclick="confirmDeletePosition('${pos}')">Clear this group</button>
      </div>
    `}
  `;
}

function renderPlayerRow(p, isStarter, pos) {
  const keyAttrs = POSITION_KEY_ATTRS[pos] || [];
  const attrStr = keyAttrs
    .filter(a => p.attributes?.[a] != null)
    .slice(0, 4)
    .map(a => `${a} ${p.attributes[a]}`)
    .join(' · ');
  const sub = [p.archetype, p.heightWeight].filter(Boolean).join(' · ') || 'Details not captured';
  return `
    <tr class="${isStarter ? 'starter' : ''}">
      <td>
        <div class="player-name">${escapeHtml(p.name)}</div>
        <div class="player-sub">${escapeHtml(sub)}</div>
      </td>
      <td>${escapeHtml(p.year || '—')}</td>
      <td class="player-ovr">${p.ovr ?? '—'}</td>
      <td class="attr-list">${escapeHtml(attrStr || '—')}</td>
      <td class="dev-trait ${devTraitClass(p.devTrait)}">${escapeHtml(p.devTrait || '—')}</td>

  `;
}

// Ingest flow
let ingestState = { position: null, files: [], extracted: null, busy: false, error: null, mode: 'paste', pasteText: '' };

function openIngest(pos) {
  ingestState = { position: pos, files: [], extracted: null, busy: false, error: null, mode: 'paste', pasteText: '' };
  renderIngestModal();
}

function setIngestMode(mode) {
  ingestState.mode = mode;
  ingestState.error = null;
  renderIngestModal();
}

function renderIngestModal() {
  const m = document.getElementById('modal-root');
  m.innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title">Update ${escapeHtml(ingestState.position)}</h2>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        ${renderIngestBody()}
      </div>
    </div>
  `;
  attachDropHandlers();
}

function renderIngestBody() {
  if (ingestState.extracted) return renderExtractedPreview();
  return renderPasteMode();
}

function renderPasteMode() {
  return `
    <p class="muted" style="font-size: 12px; margin: 0 0 14px;">In Claude chat: upload your ${escapeHtml(ingestState.position)} screenshots and ask <em>"extract ${escapeHtml(ingestState.position)} JSON for the dynasty tool"</em>. Copy the JSON response and paste it below.</p>
    <textarea id="paste-json" style="width:100%; min-height:220px; background:var(--bg-surface); border:1px solid var(--border-subtle); color:var(--text-primary); padding:12px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:12px; line-height:1.5; resize:vertical; box-sizing:border-box;" placeholder='Paste JSON here: { "positionGroup": "${escapeHtml(ingestState.position)}", "players": [ ... ] }'>${escapeHtml(ingestState.pasteText)}</textarea>
    ${renderIngestError()}
    <div class="form-actions">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="parsePastedJson()">Parse JSON</button>
    </div>
  `;
}

function renderUploadMode() {
  return `
    <p class="muted" style="font-size: 12px; margin: 0 0 14px;"><span style="color: var(--grade-warn);">Note:</span> Direct AI extraction depends on artifact API access — it's failing for you. Use "Paste JSON" instead. Keeping this here in case it starts working later.</p>
    <div class="drop-zone" id="drop-zone">
      <p class="drop-zone-title">Drop screenshots</p>
      <p class="drop-zone-text">PNG or JPG · up to 5 images</p>
      <button class="primary" onclick="document.getElementById('file-input').click()">Choose files</button>
      <input id="file-input" class="file-input" type="file" accept="image/png,image/jpeg" multiple onchange="handleFiles(this.files)" />
    </div>
    ${ingestState.files.length > 0 ? `
      <div class="thumb-grid">
        ${ingestState.files.map((f, i) => `
          <div class="thumb">
            <img src="${f.dataUrl}" alt="screenshot ${i + 1}" />
            <button class="thumb-remove" onclick="removeFile(${i})" title="Remove">×</button>
          </div>
        `).join('')}
      </div>
    ` : ''}
    ${renderIngestError()}
    ${ingestState.busy ? `<div class="status-bar"><span class="spinner"></span> Reading screenshots…</div>` : ''}
    <div class="form-actions">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="runExtraction()" ${ingestState.files.length === 0 || ingestState.busy ? 'disabled' : ''}>Extract player data</button>
    </div>
  `;
}

function renderIngestError() {
  if (!ingestState.error) return '';
  const title = ingestState.mode === 'paste' ? 'Parse failed' : 'Extraction failed — debug info below';
  return `
    <div class="status-bar error" style="flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 12px;">
      <div style="font-weight: 500;">${title}</div>
      <pre style="white-space: pre-wrap; word-break: break-word; margin: 0; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; max-height: 240px; overflow-y: auto; width: 100%; background: var(--bg-base); padding: 10px; border: 1px solid var(--border-subtle); color: var(--text-secondary); box-sizing: border-box;">${escapeHtml(ingestState.error)}</pre>
    </div>
  `;
}

function parsePastedJson() {
  const ta = document.getElementById('paste-json');
  const text = ta ? ta.value : '';
  ingestState.pasteText = text;
  if (!text.trim()) {
    ingestState.error = 'Paste JSON first.';
    renderIngestModal();
    return;
  }
  try {
    const clean = text.replace(/^```(?:json)?\s*/m, '').replace(/```\s*$/m, '').trim();
    let parsed = JSON.parse(clean);
    if (Array.isArray(parsed)) parsed = { positionGroup: ingestState.position, players: parsed };
    if (!parsed.players || !Array.isArray(parsed.players)) {
      throw new Error('JSON must have a "players" array.');
    }
    parsed.players = parsed.players.map(p => ({ ...p, position: p.position || ingestState.position, attributes: p.attributes || {} }));
    ingestState.extracted = parsed;
    ingestState.error = null;
    renderIngestModal();
  } catch (e) {
    ingestState.error = e.message;
    renderIngestModal();
  }
}

function renderExtractedPreview() {
  const players = ingestState.extracted.players || [];
  return `
    <p class="muted" style="font-size: 12px; margin: 0 0 14px;">Review the extracted data. Fix anything wrong before saving — the tool stores exactly what's in these fields.</p>
    <table class="preview-table">
      <thead>
        <tr>
          <th style="width: 22%;">Name</th>
          <th style="width: 10%;">Year</th>
          <th style="width: 10%;">OVR</th>
          <th style="width: 20%;">Archetype</th>
          <th style="width: 13%;">Dev</th>
          <th style="width: 20%;">Key attrs</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${players.map((p, i) => renderPreviewRow(p, i)).join('')}
      </tbody>
    </table>
    <div class="row-flex mt-16">
      <button class="ghost" onclick="addBlankPlayer()">+ Add player</button>
      <div class="spacer"></div>
      <button onclick="ingestState.extracted = null; renderIngestModal();">← Back</button>
      <button class="primary" onclick="commitExtracted()">Save to roster</button>
    </div>
  `;
}

function renderPreviewRow(p, i) {
  const keyAttrs = POSITION_KEY_ATTRS[ingestState.position] || [];
  const attrFields = keyAttrs.slice(0, 4).map(a => `
    <span style="display:inline-flex; gap:3px; align-items:center; margin-right:6px;">
      <span class="muted" style="font-size:10px;">${a}</span>
      <input class="compact" type="number" value="${p.attributes?.[a] ?? ''}" onchange="updatePreviewAttr(${i}, '${a}', this.value)" />
    </span>
  `).join('');
  return `
    <tr>
      <td><input class="name" type="text" value="${escapeHtml(p.name || '')}" onchange="updatePreview(${i}, 'name', this.value)" /></td>
      <td><input class="compact" type="text" value="${escapeHtml(p.year || '')}" onchange="updatePreview(${i}, 'year', this.value)" /></td>
      <td><input class="compact" type="number" value="${p.ovr ?? ''}" onchange="updatePreview(${i}, 'ovr', this.value)" /></td>
      <td><input type="text" value="${escapeHtml(p.archetype || '')}" placeholder="—" onchange="updatePreview(${i}, 'archetype', this.value)" /></td>
      <td>
        <select onchange="updatePreview(${i}, 'devTrait', this.value)">
          <option value="" ${!p.devTrait ? 'selected' : ''}>—</option>
          <option ${p.devTrait === 'Normal' ? 'selected' : ''}>Normal</option>
          <option ${p.devTrait === 'Impact' ? 'selected' : ''}>Impact</option>
          <option ${p.devTrait === 'Star' ? 'selected' : ''}>Star</option>
          <option ${p.devTrait === 'Elite' ? 'selected' : ''}>Elite</option>
        </select>
      </td>
      <td>${attrFields}</td>
      <td><button class="ghost danger" onclick="removePreviewPlayer(${i})" title="Remove">×</button></td>
    </tr>
  `;
}

function updatePreview(i, field, value) {
  if (field === 'ovr') value = parseInt(value, 10) || null;
  ingestState.extracted.players[i][field] = value;
}
function updatePreviewAttr(i, attr, value) {
  if (!ingestState.extracted.players[i].attributes) ingestState.extracted.players[i].attributes = {};
  const v = parseInt(value, 10);
  if (isNaN(v)) delete ingestState.extracted.players[i].attributes[attr];
  else ingestState.extracted.players[i].attributes[attr] = v;
}
function removePreviewPlayer(i) {
  ingestState.extracted.players.splice(i, 1);
  renderIngestModal();
}
function addBlankPlayer() {
  ingestState.extracted.players.push({ name: '', year: '', ovr: null, archetype: '', devTrait: '', attributes: {} });
  renderIngestModal();
}

function attachDropHandlers() {
  const zone = document.getElementById('drop-zone');
  if (!zone) return;
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('hover'); };
  zone.ondragleave = () => zone.classList.remove('hover');
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('hover'); handleFiles(e.dataTransfer.files); };
}

async function handleFiles(fileList) {
  const files = Array.from(fileList).slice(0, 5 - ingestState.files.length);
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    const dataUrl = await fileToDataUrl(f);
    const base64 = dataUrl.split(',')[1];
    ingestState.files.push({ name: f.name, dataUrl, base64, mediaType: f.type });
  }
  ingestState.error = null;
  renderIngestModal();
}
function removeFile(i) { ingestState.files.splice(i, 1); renderIngestModal(); }

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

const EXTRACTION_PROMPT = `You are reading screenshots from EA Sports College Football's roster screen. Extract every player visible.

Context:
- Each screenshot shows ONE position group (e.g. QB, HB). The position is shown at the top of the table area.
- The roster table on the left lists multiple players with their attribute values across columns. Different screenshots may show the SAME players with DIFFERENT scrolled attribute columns — MERGE values across screenshots per player.
- The right panel shows the currently HIGHLIGHTED player's full info: archetype, class, height & weight, hometown, dev trait. The highlighted row in the table has a lighter background.
- The highlighted player's dev trait appears under "DEV TRAIT" on the right panel.

Return ONLY valid JSON (no preamble, no markdown fences) in this exact shape:
{
  "positionGroup": "QB",
  "players": [
    {
      "name": "J. Sayin",
      "fullName": "Julian Sayin",
      "year": "SO",
      "position": "QB",
      "jerseyNumber": 10,
      "ovr": 85,
      "archetype": "Pocket Passer",
      "heightWeight": "6'1\\" 203",
      "hometown": "Carlsbad, CA",
      "devTrait": "Normal",
      "attributes": { "SPD": 81, "ACC": 87, "AGI": 84, "STR": 61, "THP": 94, "SAC": 90 }
    }
  ]
}

Rules:
- Read attribute names from the column headers shown. Use those exact abbreviations as JSON keys.
- Match attribute values to the correct player by ROW.
- Only include archetype, heightWeight, hometown, devTrait, fullName when they're visible (right panel). Otherwise omit them.
- Skip any field you can't read clearly — never guess.
- Output ONLY the JSON object.`;

async function runExtraction() {
  if (ingestState.files.length === 0) return;
  ingestState.busy = true;
  ingestState.error = null;
  renderIngestModal();
  try {
    const content = [
      ...ingestState.files.map(f => ({
        type: 'image',
        source: { type: 'base64', media_type: f.mediaType || 'image/png', data: f.base64 }
      })),
      { type: 'text', text: EXTRACTION_PROMPT }
    ];
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content }]
      })
    });
    const rawText = await resp.text();
    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}\n\n${rawText.slice(0, 800)}`);
    }
    let data;
    try { data = JSON.parse(rawText); }
    catch (e) { throw new Error(`API response was not JSON.\n\n${rawText.slice(0, 500)}`); }
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    if (!text) {
      throw new Error(`Empty model response.\nstop_reason: ${data.stop_reason || 'unknown'}\n\nFull data: ${JSON.stringify(data).slice(0, 500)}`);
    }
    const clean = text.replace(/^```(?:json)?\s*/m, '').replace(/```\s*$/m, '').trim();
    let parsed;
    try { parsed = JSON.parse(clean); }
    catch (e) {
      const match = clean.match(/\{[\s\S]*\}/);
      if (!match) throw new Error(`Couldn't find JSON in response.\n\nModel said:\n${text.slice(0, 600)}`);
      try { parsed = JSON.parse(match[0]); }
      catch (e2) { throw new Error(`JSON parse failed (likely truncated at ${text.length} chars).\nstop_reason: ${data.stop_reason || 'unknown'}\n\nModel said:\n${text.slice(0, 600)}`); }
    }
    if (!parsed.players || !Array.isArray(parsed.players)) {
      throw new Error(`No "players" array in JSON.\n\nGot: ${JSON.stringify(parsed).slice(0, 500)}`);
    }
    parsed.players = parsed.players.map(p => ({ ...p, position: p.position || ingestState.position, attributes: p.attributes || {} }));
    ingestState.extracted = parsed;
    ingestState.busy = false;
    renderIngestModal();
  } catch (e) {
    ingestState.busy = false;
    ingestState.error = e.message;
    renderIngestModal();
  }
}

async function commitExtracted() {
  const pos = ingestState.position;
  const players = ingestState.extracted.players.filter(p => p.name && p.name.trim());
  if (players.length === 0) { alert('Add at least one player or cancel.'); return; }

  // Snapshot current state of this position before mutating
  const before = playersForPosition(pos).map(p => ({ ...p }));
  state.snapshots.push({
    seasonWeek: `${state.team.season}.${state.team.week}`,
    timestamp: Date.now(),
    position: pos,
    players: before
  });
  if (state.snapshots.length > 50) state.snapshots = state.snapshots.slice(-50);

  for (const p of players) {
    const playerPos = p.position || pos;
    const id = makePlayerId(playerPos, p.name);
    const existing = state.players[id] || {};
    state.players[id] = {
      ...existing,
      id,
      name: p.name.trim(),
      fullName: p.fullName || existing.fullName,
      year: p.year || existing.year,
      position: playerPos,
      jerseyNumber: p.jerseyNumber || existing.jerseyNumber,
      ovr: p.ovr ?? existing.ovr,
      archetype: p.archetype || existing.archetype,
      heightWeight: p.heightWeight || existing.heightWeight,
      hometown: p.hometown || existing.hometown,
      devTrait: p.devTrait || existing.devTrait,
      attributes: { ...(existing.attributes || {}), ...(p.attributes || {}) },
      lastUpdated: Date.now(),
      lastSeasonWeek: `${state.team.season}.${state.team.week}`
    };
  }
  await saveState();
  closeModal();
  state.currentView = 'detail';
  state.currentPosition = pos;
  render();
}

// Init
(async function init() {
  await loadState();
  render();
})();
</script>

</body>
</html>
